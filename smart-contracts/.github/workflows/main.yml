name: CI

# Controls when the action will run.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Lint Build Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn

      - uses: foundry-rs/foundry-toolchain@v1.2.0
        with:
          version: v1.5.1

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Verify generated mainnet manifest
        run: yarn verify:mainnet-manifest

      - name: Build
        run: yarn build

      - name: Unit and Foundry tests
        run: yarn test

      - name: Fork tests
        if: ${{ github.event_name != 'pull_request' && secrets.MAINNET_RPC_URL != '' }}
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
        run: yarn test:fork && yarn test:foundry:fork

      - name: Verify packaged mainnet state
        if: ${{ github.event_name != 'pull_request' && secrets.MAINNET_RPC_URL != '' }}
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
        run: yarn verify:mainnet-state
